name: build

# Builds every pull request to main from a fork on the self-hosted rh-pr-fork runners, every pull
# request from a branch of this repository not starting with batch/ on the self-hosted
# rh-pr-trusted runners, and every merge queue group, push to main, manual run and pull request
# from a batch/ branch of this repository (the batcher's batch pull requests) on the self-hosted
# rh-big runner (see CACHE.md, "Self-hosted runners"), with the shared build cache (CACHE.md). So
# the merge queue and batch pull requests never wait behind other pull requests. It fails if the
# build fails, if any module reports `sorry`, or if one of the five theorems of src/Main.lean
# depends on an axiom other than propext, Classical.choice and Quot.sound. The job is called
# `lake build` in every case: it is the merge queue's required check.
#
# Pull requests run their own code, so they use `pull_request` (not `pull_request_target`), a
# read-only token and no secrets. A pull request from a fork runs only on the rh-pr-fork runners,
# which assume hostile code and hold no credential. A pull request whose head branch is in this
# repository (a branch of someone who can already push here) is trusted like a manual run and builds
# on the rh-pr-trusted or rh-big runners. The job-started hook of every self-hosted runner
# (scripts/runner/job-started.sh) admits only the jobs sent to its label, checking the head
# repository and branch in the event payload. publish-ci-cache.yml never takes a pull request run's
# artifact: scripts/ci-github.py accepts only merge_group, push to main and workflow_dispatch runs
# whose job ran on the rh-big runner, and pull request runs upload nothing. No job here publishes
# anything: the cache is only read, over public HTTPS, and every artifact is checked against the
# SHA-256 in the record it was selected from. On the rh-big runner, except for pull requests, the
# job uploads the new cache outputs (scripts/ci-cache-stage.py) as the artifact cache-<commit>;
# after the merge queue has moved main to that commit, .github/workflows/publish-ci-cache.yml
# verifies them with main's code and publishes them.
#
# The cache restore uses the record for the exact build inputs when there is one. On a miss,
# scripts/ci-cache-get.py --baseline walks first-parent history from the PR's tested base, or
# from main for other events. If no compatible record is available there, it tries the record
# pinned in scripts/cache-baseline.json. Lake then rebuilds modules whose inputs changed and
# the modules that import them.
#
# A change to a module that most of src imports (Lib.Base, Lib.Speed, ...) rebuilds all 802
# modules: about 4 hours of module build time, so about 10 minutes on the 64 vCPUs of the
# rh-big runner, about 15 to 20 minutes on the 37 or 38 of an rh-pr-trusted runner, and one to
# two hours on the 4 cores of ubuntu-latest. A change to lean-toolchain or lake-manifest.json gets
# no baseline, and Mathlib's cache must also match.

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: lake build
    # Pull requests from forks run on the rh-pr-fork runners. (GitHub does not pass repository
    # variables to pull requests from forks, so this cannot be a variable; replacing that
    # fromJSON with '"ubuntu-latest"' sends them back to GitHub-hosted runners.) Other pull
    # requests run on the rh-pr-trusted runners, except those whose head branch starts with
    # batch/, which run on the rh-big runner with every other event.
    runs-on: ${{ github.event_name != 'pull_request' && fromJSON('["self-hosted", "rh-big"]') || github.event.pull_request.head.repo.full_name != github.repository && fromJSON('["self-hosted", "rh-pr-fork"]') || startsWith(github.event.pull_request.head.ref, 'batch/') && fromJSON('["self-hosted", "rh-big"]') || fromJSON('["self-hosted", "rh-pr-trusted"]') }}
    timeout-minutes: 360
    env:
      # Pull requests upload nothing, whichever runner they build on.
      STAGE: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check whether the merge queue has built this commit
        # The merge queue moves main to the exact commit it built, and that build's artifact is
        # what gets published, so the push build of that commit has nothing left to do.
        id: queue
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/ci-github.py queue-tested --sha "$GITHUB_SHA"

      - name: Fetch history for the cache baseline
        if: steps.queue.outputs.tested != 'true'
        # The merge under test includes exactly this base. Main can advance while a PR is queued.
        env:
          BASELINE_START: ${{ github.event.pull_request.base.sha || 'refs/heads/main' }}
        run: git fetch --no-tags --depth=200 origin "+$BASELINE_START:refs/ci/cache-baseline"

      - name: Install elan and the toolchain in lean-toolchain
        if: steps.queue.outputs.tested != 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          rm elan-init.sh
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version

      - name: Test the cache baseline selection
        if: steps.queue.outputs.tested != 'true'
        run: python3 -I scripts/tests/test_ci_cache_baseline.py

      - name: Restore Mathlib's cache
        if: steps.queue.outputs.tested != 'true'
        # As in scripts/lake-cache-get.sh, which `lake exe cache get` runs.
        env:
          MATHLIB_CACHE_GET_URL: https://cache.mathlib.org/mathlib4
        run: lake exe mathlib/cache get

      - name: Restore Tau Ceti's cache
        if: steps.queue.outputs.tested != 'true'
        # As in scripts/lake-cache-get.sh: checks the Mathlib pins agree and that the statements
        # import no Tau Ceti module, then fetches the oleans of the imported Tau Ceti modules.
        run: python3 scripts/tauceti-cache-get.py

      - name: Restore this project's cache
        if: steps.queue.outputs.tested != 'true'
        # Exit 0: the exact build inputs were restored, and nothing should compile.
        # Exit 4: a baseline was restored, and lake build compiles what changed since.
        # Exit 3: no record at all, and lake build compiles everything.
        run: |
          ulimit -Sn "$(ulimit -Hn)"
          status=0
          python3 scripts/ci-cache-get.py --baseline refs/ci/cache-baseline || status=$?
          case "$status" in
            0) echo "::notice::Restored the cache for these exact build inputs." ;;
            4) echo "::notice::Restored a baseline cache; lake build compiles the modules that changed since and the modules that import them." ;;
            3) echo "::warning::No cache record matches these build inputs or any baseline; lake build compiles every module." ;;
            *) exit "$status" ;;
          esac

      - name: lake build
        if: steps.queue.outputs.tested != 'true'
        run: |
          set -o pipefail
          if [[ "$STAGE" == true ]]; then
            # As the hand publisher builds: -o writes Lake's map of every module's artifact, and
            # packs each module's .ltar under .lake/build/ir.
            export LAKE_CACHE_DIR="$PWD/.lake/cache" LAKE_RESTORE_ARTIFACTS=true
            lake build -o "$RUNNER_TEMP/outputs.jsonl" 2>&1 | tee build.log
          else
            lake build 2>&1 | tee build.log
          fi
          # Lake replays the saved messages of the modules it did not compile, so this covers
          # restored modules too.
          if grep -n -e 'declaration uses `sorry`' -e "declaration uses 'sorry'" build.log; then
            echo "::error::The build reports declarations that use sorry."
            exit 1
          fi

      - name: Check the axioms of the five theorems
        if: steps.queue.outputs.tested != 'true'
        run: |
          set -o pipefail
          lake env lean scripts/PrintAxioms.lean 2>&1 | tee axioms.log
          axioms='depends on axioms: [propext, Classical.choice, Quot.sound]'
          printf "'%s' $axioms\n" riemannHypothesis riemannZeta_eq_zero_re LFunction_ne_zero_of_half_lt_re \
            LFunction_eq_zero_re LFunction_eq_zero_re_of_isPrimitive > expected-axioms.log
          if ! diff -u expected-axioms.log axioms.log; then
            echo "::error::The five theorems must depend on exactly propext, Classical.choice and Quot.sound."
            exit 1
          fi

      - name: Stage the new cache outputs
        if: env.STAGE == 'true' && steps.queue.outputs.tested != 'true'
        run: python3 -I scripts/ci-cache-stage.py "$RUNNER_TEMP/outputs.jsonl" "$RUNNER_TEMP/cache-stage"

      - name: Upload the new cache outputs
        if: env.STAGE == 'true' && steps.queue.outputs.tested != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cache-${{ github.sha }}
          path: ${{ runner.temp }}/cache-stage
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
